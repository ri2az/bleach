<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bleach Tracker - 366 Épisodes</title>

    <!-- CONFIGURATION ACCUEIL IPHONE (iOS) & WEB APP -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bleach Tracker">
    
    <!-- L'icône iOS (PNG requis) -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <!-- Favicon standard pour navigateurs web -->
    <link rel="icon" type="image/png" sizes="32x32" href="apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bleach: {
                            accent: '#2563eb',
                            dark: '#09090b',
                            card: '#18181b',
                            border: '#27272a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #09090b; color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; }
        .episode-card { transition: all 0.2s ease; }
        .episode-card:hover { transform: translateY(-3px); }
        .checkbox-custom { accent-color: #2563eb; width: 1.25rem; height: 1.25rem; cursor: pointer; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="bg-bleach-card border-b border-bleach-border sticky top-0 z-40 backdrop-blur-md bg-opacity-90">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-wand-magic-sparkles text-bleach-accent text-xl"></i>
                <h1 class="text-xl font-black uppercase tracking-wider text-white">Bleach <span class="text-bleach-accent">Tracker</span></h1>
                <span class="text-[10px] bg-bleach-accent text-white font-bold px-2 py-0.5 rounded-full">366 Épisodes</span>
            </div>
            
            <div class="w-full md:w-80 relative">
                <input type="text" id="searchInput" placeholder="Rechercher (ex: 167, Ulquiorra)..." class="w-full bg-bleach-dark border border-bleach-border rounded-xl py-1.5 px-3 pl-9 text-xs text-white focus:outline-none focus:border-bleach-accent transition">
                <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500 text-xs"></i>
            </div>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow">
        
        <!-- PANNEAU DE PROGRESSION AVEC LES 2 BARRES -->
        <section class="bg-bleach-card rounded-2xl p-5 mb-6 border border-bleach-border shadow-xl space-y-4">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-bleach-accent"></i> Suivi de Visionnage
                </h2>
                <div class="flex items-center gap-3 text-xs text-zinc-400">
                    <span id="timeWatchedText" class="bg-bleach-dark px-3 py-1 rounded-lg border border-bleach-border"><i class="fa-regular fa-clock text-bleach-accent mr-1"></i> Visionné : 0h</span>
                    <span id="timeLeftText" class="bg-bleach-dark px-3 py-1 rounded-lg border border-bleach-border"><i class="fa-solid fa-hourglass-half text-amber-500 mr-1"></i> Restant : 0h</span>
                </div>
            </div>

            <!-- Barre 1: Progression globale -->
            <div>
                <div class="flex justify-between mb-1 text-xs font-semibold">
                    <span class="text-zinc-300">Progression globale (1 à 366)</span>
                    <span id="classicProgressText" class="text-white">23% (84/366)</span>
                </div>
                <div class="w-full bg-bleach-dark rounded-full h-3 border border-bleach-border overflow-hidden">
                    <div id="classicProgressBar" class="bg-bleach-accent h-full transition-all duration-300" style="width: 23%"></div>
                </div>
            </div>

            <!-- Barre 2: Progression Histoire Principale (Canon + Semi-filler) -->
            <div>
                <div class="flex justify-between mb-1 text-xs font-semibold">
                    <span class="text-zinc-300"><i class="fa-solid fa-fire text-emerald-400 mr-1.5"></i>Histoire Principale (Canon + Semi-filler)</span>
                    <span id="canonProgressText" class="text-emerald-400">39%</span>
                </div>
                <div class="w-full bg-bleach-dark rounded-full h-2.5 border border-bleach-border overflow-hidden">
                    <div id="canonProgressBar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 39%"></div>
                </div>
            </div>

            <!-- CONTROLES DATA -->
            <div class="mt-2 pt-3 border-t border-bleach-border/50 flex flex-wrap justify-between items-center gap-2 text-xs">
                <div class="flex gap-2">
                    <button id="exportBtn" class="bg-bleach-dark hover:bg-zinc-800 text-zinc-300 px-3 py-1.5 rounded-lg border border-bleach-border transition flex items-center gap-1.5">
                        <i class="fa-solid fa-download text-bleach-accent"></i> Exporter JSON
                    </button>
                    <button id="importBtn" class="bg-bleach-dark hover:bg-zinc-800 text-zinc-300 px-3 py-1.5 rounded-lg border border-bleach-border transition flex items-center gap-1.5">
                        <i class="fa-solid fa-upload text-emerald-500"></i> Importer
                    </button>
                    <input type="file" id="importFile" class="hidden" accept=".json">
                </div>
                <button id="resetBtn" class="text-zinc-500 hover:text-red-400 transition flex items-center gap-1">
                    <i class="fa-solid fa-arrow-rotate-left"></i> Réinitialiser
                </button>
            </div>
        </section>

        <!-- FILTRES & SELECTION D'ARCS -->
        <section class="mb-6 space-y-3">
            <div class="flex flex-wrap gap-2 items-center justify-between">
                <div class="flex flex-wrap gap-1.5" id="typeFilters">
                    <button data-filter="all" class="type-filter-btn active px-3 py-1.5 rounded-lg bg-bleach-accent text-white font-semibold text-xs">Tous</button>
                    <button data-filter="canon" class="type-filter-btn px-3 py-1.5 rounded-lg bg-bleach-card text-zinc-400 font-medium border border-bleach-border hover:bg-zinc-800 transition text-xs">Canon uniquement</button>
                    <button data-filter="filler" class="type-filter-btn px-3 py-1.5 rounded-lg bg-bleach-card text-zinc-400 font-medium border border-bleach-border hover:bg-zinc-800 transition text-xs">Hors-Série (HS)</button>
                    <button data-filter="unwatched" class="type-filter-btn px-3 py-1.5 rounded-lg bg-bleach-card text-zinc-400 font-medium border border-bleach-border hover:bg-zinc-800 transition text-xs">Non vus</button>
                </div>

                <div class="w-full sm:w-auto">
                    <select id="arcSelect" class="w-full sm:w-72 bg-bleach-card border border-bleach-border rounded-xl py-1.5 px-3 text-xs text-white focus:outline-none focus:border-bleach-accent">
                        <option value="all">Tous les Arcs Narratifs</option>
                    </select>
                </div>
            </div>

            <!-- EN-TÊTE D'ARC SELECTIONNÉ -->
            <div id="arcHeader" class="hidden bg-bleach-card p-4 rounded-xl border border-bleach-border flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                <div>
                    <h3 id="arcTitle" class="text-sm font-bold text-white"></h3>
                    <p id="arcDescription" class="text-xs text-zinc-400 mt-0.5 max-w-3xl"></p>
                </div>
                <button id="markArcWatchedBtn" class="bg-bleach-accent hover:bg-blue-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition whitespace-nowrap shadow-md">
                    <i class="fa-solid fa-check-double mr-1"></i> Valider l'arc
                </button>
            </div>
        </section>

        <!-- GRILLE DES EPISODES -->
        <div id="episodesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
    </main>

    <footer class="bg-bleach-card border-t border-bleach-border py-4 text-center text-xs text-zinc-500">
        Bleach Tracker - Données TMDB & BetaSeries
    </footer>

    <!-- MODALE FICHE EPISODE -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modalContainer" class="bg-bleach-card border border-bleach-border rounded-2xl max-w-xl w-full overflow-hidden shadow-2xl">
            <div class="relative h-52 bg-black">
                <img id="modalImg" src="" alt="" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-bleach-card via-transparent to-black/60"></div>
                <button id="closeModalBtn" class="absolute top-3 right-3 text-white bg-black/50 hover:bg-black/80 rounded-full w-8 h-8 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
                <div class="absolute bottom-3 left-4 right-4">
                    <span id="modalBadge" class="text-[9px] px-2 py-0.5 rounded font-bold uppercase inline-block mb-1"></span>
                    <h2 id="modalTitle" class="text-lg font-black text-white leading-tight"></h2>
                    <p id="modalSub" class="text-xs text-zinc-400 font-medium mt-0.5"></p>
                </div>
            </div>
            <div class="p-5 space-y-3">
                <div class="flex items-center gap-4 text-xs text-zinc-400 border-b border-bleach-border pb-2">
                    <div><i class="fa-solid fa-star text-yellow-500 mr-1"></i><span id="modalRating" class="font-bold text-white"></span> / 10</div>
                    <div><i class="fa-solid fa-calendar text-bleach-accent mr-1"></i><span id="modalDate"></span></div>
                </div>
                <div>
                    <h3 class="text-[10px] uppercase font-bold text-zinc-500 mb-1 tracking-wider">Synopsis</h3>
                    <p id="modalOverview" class="text-zinc-300 text-xs leading-relaxed max-h-36 overflow-y-auto pr-1"></p>
                </div>
                <div class="pt-2">
                    <a id="modalBetaBtn" href="#" target="_blank" class="w-full text-center bg-bleach-accent hover:bg-blue-600 text-white font-bold py-2 rounded-xl transition text-xs block">
                        Fiche BetaSeries
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = "02a0fe7ad4f325897c61808483d554e0";
        const BLEACH_CLASSIC_ID = 30984;

        const range = (s, e) => Array.from({length: e - s + 1}, (_, i) => s + i);

        const ARCS = [
            { id: 1, name: "1. Substitute Shinigami", eps: range(1, 20), desc: "Ichigo Kurosaki devient un Shinigami remplaçant." },
            { id: 2, name: "2. Soul Society: Infiltration", eps: range(21, 41), desc: "Invasion du Seireitei pour sauver Rukia Kuchiki." },
            { id: 3, name: "3. Soul Society: Le Sauvetage", eps: range(42, 63), desc: "Combats contre les Capitaines et trahison d'Aizen." },
            { id: 4, name: "4. Bounts (HS)", eps: range(64, 91), desc: "Invasion des Bounts dans le monde humain." },
            { id: 5, name: "5. Bounts: Assaut Seireitei (HS)", eps: range(92, 108), desc: "Bataille finale contre Jin Kariya au Seireitei." },
            { id: 6, name: "6. Arrancar: L'Arrivée", eps: range(109, 131), desc: "Menace des Arrancars et apprentissage chez les Vizards." },
            { id: 7, name: "7. Hueco Mundo", eps: range(132, 151), desc: "Infiltration dans Las Noches pour sauver Orihime." },
            { id: 8, name: "8. Arrancar: Combats Féroces", eps: range(152, 167), desc: "Combats contre les Espadas (Grimmjow vs Ichigo)." },
            { id: 9, name: "9. Shusuke Amagai (HS)", eps: range(168, 189), desc: "Nouveau capitaine de la 3ème Division." },
            { id: 10, name: "10. Arrancar vs Shinigami", eps: range(190, 205), desc: "L'armée de la Soul Society intervient au Hueco Mundo." },
            { id: 11, name: "11. Le Passé (Turn Back the Pendulum)", eps: range(206, 212), desc: "Origines de la Vizardisation 110 ans plus tôt." },
            { id: 12, name: "12. Fausse Ville de Karakura", eps: range(213, 229), desc: "Guerre totale entre les Capitaines et le Top 3 des Espadas." },
            { id: 13, name: "13. Rebellions des Zanpakuto (HS)", eps: range(230, 265), desc: "Les Zanpakuto prennent leur indépendance sous Muramasa." },
            { id: 14, name: "14. Arrancar: La Chute", eps: range(266, 316), desc: "Affrontement final contre Aizen et forme Mugetsu." },
            { id: 15, name: "15. Armée d'Invasion Gotei 13 (HS)", eps: range(317, 342), desc: "Des reigais (clones) prennent la place des capitaines." },
            { id: 16, name: "16. Fullbringer", eps: range(343, 366), desc: "Ichigo cherche à retrouver ses pouvoirs grâce à Xcution." }
        ];

        const fillers = [33, 50, ...range(64, 108), ...range(128, 137), ...range(147, 149), ...range(168, 189), 204, 205, 213, 214, ...range(227, 265), 287, 298, 299, ...range(303, 305), ...range(311, 341), 355];
        const semiFillers = [8, 27, 32, 46, 109, 111, 116, 119, 141, 143, 146, 156, 160, 161, 190, 193, 206, 269, 342, 343];

        const TOTAL_CLASSIC = 366;
        const episodes = [];

        for (let i = 1; i <= TOTAL_CLASSIC; i++) {
            let type = "Canon", cat = "canon";

            if (fillers.includes(i)) { type = "Hors-série"; cat = "filler"; }
            else if (semiFillers.includes(i)) { type = "Semi-filler"; cat = "semifiller"; }

            const arc = ARCS.find(a => a.eps.includes(i));
            
            episodes.push({
                id: i,
                title: `Épisode ${i}`,
                type: type,
                category: cat,
                arcId: arc ? arc.id : 1,
                arcName: arc ? arc.name : "",
                betaUrl: `https://www.betaseries.com/episode/bleachjp/s01e${i}`,
                stillPath: null,
                overview: "Chargement du synopsis...",
                voteAverage: "N/A",
                airDate: "Inconnue"
            });
        }

        // Progression sauvegardée initiale (84 premiers épisodes)
        const defaultWatched = {};
        for (let i = 1; i <= 84; i++) {
            defaultWatched[i] = true;
        }

        let watched = JSON.parse(localStorage.getItem('bleachWatched')) || defaultWatched;
        let tmdbCache = JSON.parse(localStorage.getItem('bleachTmdbCache')) || {};
        let currentTypeFilter = 'all';
        let currentArcFilter = 'all';
        let searchQuery = '';

        const grid = document.getElementById('episodesGrid');
        const searchInput = document.getElementById('searchInput');
        const arcSelect = document.getElementById('arcSelect');
        const modalOverlay = document.getElementById('modalOverlay');

        ARCS.forEach(arc => {
            const opt = document.createElement('option');
            opt.value = arc.id;
            opt.textContent = `${arc.name} (${arc.eps[0]}-${arc.eps[arc.eps.length-1]})`;
            arcSelect.appendChild(opt);
        });

        async function fetchTMDB() {
            if (Object.keys(tmdbCache).length > 0) {
                applyCache();
                renderEpisodes();
            }

            try {
                const resClassic = await fetch(`https://api.themoviedb.org/3/tv/${BLEACH_CLASSIC_ID}/season/1?api_key=${TMDB_API_KEY}&language=fr-FR`);

                if (resClassic.ok) {
                    const data = await resClassic.json();
                    data.episodes?.forEach(e => cacheEpData(e.episode_number, e));
                }

                localStorage.setItem('bleachTmdbCache', JSON.stringify(tmdbCache));
                applyCache();
                renderEpisodes();
            } catch (err) {
                console.error("TMDB Fetch Error:", err);
            }
        }

        function cacheEpData(globalId, tmdbEp) {
            tmdbCache[globalId] = {
                title: tmdbEp.name,
                stillPath: tmdbEp.still_path ? `https://image.tmdb.org/t/p/w780${tmdbEp.still_path}` : null,
                overview: tmdbEp.overview || "Aucun synopsis disponible pour cet épisode.",
                voteAverage: tmdbEp.vote_average ? tmdbEp.vote_average.toFixed(1) : "N/A",
                airDate: tmdbEp.air_date ? new Date(tmdbEp.air_date).toLocaleDateString('fr-FR') : "Inconnue"
            };
        }

        function applyCache() {
            episodes.forEach(ep => {
                if (tmdbCache[ep.id]) {
                    Object.assign(ep, tmdbCache[ep.id]);
                }
            });
        }

        function toggleWatched(id, isChecked) {
            if (isChecked) watched[id] = true;
            else delete watched[id];
            saveState();
            
            const card = document.getElementById(`card-${id}`);
            if (card) {
                card.classList.toggle('opacity-40', isChecked);
                card.classList.toggle('grayscale', isChecked);
            }
        }

        function saveState() {
            localStorage.setItem('bleachWatched', JSON.stringify(watched));
            updateProgress();
        }

        function updateProgress() {
            // 1. Progression globale
            const watchedIds = Object.keys(watched).map(Number).filter(id => id <= TOTAL_CLASSIC);
            const watchedCount = watchedIds.length;
            const pctClassic = Math.round((watchedCount / TOTAL_CLASSIC) * 100) || 0;

            document.getElementById('classicProgressText').textContent = `${pctClassic}% (${watchedCount}/${TOTAL_CLASSIC})`;
            document.getElementById('classicProgressBar').style.width = `${pctClassic}%`;

            // 2. Progression Histoire Principale (Canon + Semi-filler)
            const mainStoryEps = episodes.filter(e => e.category === 'canon' || e.category === 'semifiller');
            const watchedMainStoryCount = mainStoryEps.filter(e => watched[e.id]).length;
            const pctMainStory = Math.round((watchedMainStoryCount / mainStoryEps.length) * 100) || 0;

            document.getElementById('canonProgressText').textContent = `${pctMainStory}% (${watchedMainStoryCount}/${mainStoryEps.length})`;
            document.getElementById('canonProgressBar').style.width = `${pctMainStory}%`;

            // Temps de visionnage
            const watchedHours = Math.floor((watchedCount * 22) / 60);
            const totalHours = Math.floor((TOTAL_CLASSIC * 22) / 60);
            
            document.getElementById('timeWatchedText').innerHTML = `<i class="fa-regular fa-clock text-bleach-accent mr-1"></i> Visionné : ${watchedHours}h`;
            document.getElementById('timeLeftText').innerHTML = `<i class="fa-solid fa-hourglass-half text-amber-500 mr-1"></i> Restant : ${totalHours - watchedHours}h`;
        }

        function renderEpisodes() {
            const filtered = episodes.filter(ep => {
                const matchType = currentTypeFilter === 'all' || 
                                  (currentTypeFilter === 'canon' && (ep.category === 'canon' || ep.category === 'semifiller')) ||
                                  (currentTypeFilter === 'filler' && ep.category === 'filler') ||
                                  (currentTypeFilter === 'unwatched' && !watched[ep.id]);
                
                const matchArc = currentArcFilter === 'all' || ep.arcId === parseInt(currentArcFilter);
                const matchSearch = ep.id.toString().includes(searchQuery) || 
                                    ep.title.toLowerCase().includes(searchQuery);

                return matchType && matchArc && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-zinc-500 text-xs">Aucun épisode trouvé.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(ep => {
                const isWatched = !!watched[ep.id];
                const badgeColor = ep.category === 'filler' ? 'bg-red-900/80 text-red-200' : 'bg-emerald-900/80 text-emerald-200';
                const imageSrc = ep.stillPath || 'https://static.vecteezy.com/system/resources/previews/028/574/845/non_2x/bleach-anime-logo-free-vector.jpg';

                return `
                    <div id="card-${ep.id}" onclick="openEpisodeModal(${ep.id})" class="episode-card bg-bleach-card rounded-xl overflow-hidden border border-bleach-border ${isWatched ? 'opacity-40 grayscale' : ''} flex flex-col justify-between cursor-pointer">
                        <div>
                            <div class="relative h-28 bg-black overflow-hidden">
                                <img src="${imageSrc}" alt="" class="w-full h-full object-cover opacity-60">
                                <div class="absolute inset-0 bg-gradient-to-t from-bleach-card via-transparent to-transparent"></div>
                                <span class="absolute top-2 right-2 ${badgeColor} text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider">${ep.type}</span>
                                <span class="absolute bottom-1 left-2 text-white font-black text-sm">#${ep.id}</span>
                            </div>
                            <div class="p-2.5">
                                <h3 class="text-xs font-bold text-zinc-100 line-clamp-1" title="${ep.title}">${ep.title}</h3>
                                <p class="text-[10px] text-zinc-500 mt-0.5 truncate">${ep.arcName}</p>
                            </div>
                        </div>
                        <div class="p-2.5 pt-0 flex justify-between items-center border-t border-bleach-border/40 mt-1">
                            <span class="text-[10px] text-bleach-accent font-semibold"><i class="fa-solid fa-circle-info mr-1"></i>Détails</span>
                            <input type="checkbox" ${isWatched ? 'checked' : ''} class="checkbox-custom" onclick="event.stopPropagation()" onchange="toggleWatched(${ep.id}, this.checked)">
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openEpisodeModal(epId) {
            const ep = episodes.find(e => e.id === epId);
            if (!ep) return;

            document.getElementById('modalImg').src = ep.stillPath || 'https://static.vecteezy.com/system/resources/previews/028/574/845/non_2x/bleach-anime-logo-free-vector.jpg';
            document.getElementById('modalTitle').textContent = ep.title;
            document.getElementById('modalSub').textContent = `Épisode ${ep.id} • ${ep.arcName}`;
            document.getElementById('modalOverview').textContent = ep.overview;
            document.getElementById('modalRating').textContent = ep.voteAverage;
            document.getElementById('modalDate').textContent = ep.airDate;
            document.getElementById('modalBetaBtn').href = ep.betaUrl;

            const modalBadge = document.getElementById('modalBadge');
            modalBadge.textContent = ep.type;
            modalBadge.className = `text-[9px] px-2 py-0.5 rounded font-bold uppercase inline-block mb-1 ${ep.category === 'filler' ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'}`;

            modalOverlay.classList.remove('hidden');
        }

        document.getElementById('closeModalBtn').onclick = () => modalOverlay.classList.add('hidden');
        modalOverlay.onclick = (e) => { if (e.target === modalOverlay) modalOverlay.classList.add('hidden'); };

        searchInput.oninput = (e) => { searchQuery = e.target.value.toLowerCase(); renderEpisodes(); };

        document.querySelectorAll('.type-filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.type-filter-btn').forEach(b => {
                    b.classList.remove('bg-bleach-accent', 'text-white');
                    b.classList.add('bg-bleach-card', 'text-zinc-400');
                });
                btn.classList.remove('bg-bleach-card', 'text-zinc-400');
                btn.classList.add('bg-bleach-accent', 'text-white');
                currentTypeFilter = btn.dataset.filter;
                renderEpisodes();
            };
        });

        arcSelect.onchange = (e) => {
            currentArcFilter = e.target.value;
            const arcHeader = document.getElementById('arcHeader');
            if (currentArcFilter !== 'all') {
                const selectedArc = ARCS.find(a => a.id === parseInt(currentArcFilter));
                document.getElementById('arcTitle').textContent = selectedArc.name;
                document.getElementById('arcDescription').textContent = selectedArc.desc;
                arcHeader.classList.remove('hidden');
            } else {
                arcHeader.classList.add('hidden');
            }
            renderEpisodes();
        };

        document.getElementById('markArcWatchedBtn').onclick = () => {
            if (currentArcFilter === 'all') return;
            const selectedArc = ARCS.find(a => a.id === parseInt(currentArcFilter));
            selectedArc?.eps.forEach(id => { watched[id] = true; });
            saveState();
            renderEpisodes();
        };

        document.getElementById('exportBtn').onclick = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(watched));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "bleach_tracker_backup.json";
            a.click();
        };

        document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
        document.getElementById('importFile').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    watched = JSON.parse(evt.target.result);
                    saveState();
                    renderEpisodes();
                } catch (err) { alert("Fichier JSON invalide."); }
            };
            reader.readAsText(file);
        };

        document.getElementById('resetBtn').onclick = () => {
            if (confirm("Réinitialiser votre progression ?")) {
                watched = {};
                saveState();
                renderEpisodes();
            }
        };

        // Init
        updateProgress();
        renderEpisodes();
        fetchTMDB();
    </script>
</body>
</html>
