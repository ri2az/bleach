<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bleach - Tracker 366 Épisodes Complet</title>
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bleach: {
                            accent: '#3b82f6',
                            dark: '#0a0a0a',
                            gray: '#161616',
                            card: '#1f1f1f',
                            light: '#f1f1f1'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0a; color: #f1f1f1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .episode-card { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .episode-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.25); }
        .checkbox-custom { accent-color: #3b82f6; width: 1.5rem; height: 1.5rem; cursor: pointer; }
        .progress-bar-inner { transition: width 0.5s ease-in-out; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2563eb; }
    </style>
</head>
<body class="min-h-screen bg-bleach-dark">

    <header class="bg-bleach-gray border-b border-gray-800 sticky top-0 z-40 shadow-xl shadow-black">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <h1 class="text-2xl font-black text-white uppercase tracking-wider">Bleach <span class="text-gray-400 font-light">Tracker</span></h1>
            </div>
            <div class="w-full md:w-1/3 relative">
                <input type="text" id="searchInput" placeholder="Chercher par numéro ou titre..." class="w-full bg-bleach-dark border border-gray-800 rounded-full py-2 px-4 pl-10 text-white focus:outline-none focus:border-bleach-accent focus:ring-1 focus:ring-bleach-accent transition">
                <i class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <section class="bg-bleach-gray rounded-xl p-6 mb-8 border border-gray-800 shadow-2xl">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-white"><i class="fa-solid fa-chart-pie text-bleach-accent"></i> Ma Progression</h2>
            <div class="space-y-6">
                <div>
                    <div class="flex justify-between mb-1 text-sm font-medium">
                        <span class="text-gray-300">Progression Globale</span>
                        <span id="globalProgressText" class="text-white font-semibold">0% (0/366)</span>
                    </div>
                    <div class="w-full bg-gray-900 rounded-full h-3 border border-gray-800">
                        <div id="globalProgressBar" class="bg-white h-3 rounded-full progress-bar-inner shadow-[0_0_8px_rgba(255,255,255,0.3)]" style="width: 0%"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between mb-1 text-sm font-medium">
                        <span class="text-gray-300">Progression Histoire Principale (Canon + Semi-filler)</span>
                        <span id="canonProgressText" class="text-bleach-accent font-semibold">0%</span>
                    </div>
                    <div class="w-full bg-gray-900 rounded-full h-3 border border-gray-800 shadow-inner">
                        <div id="canonProgressBar" class="bg-green-600 h-3 rounded-full progress-bar-inner shadow-[0_0_10px_rgba(22,163,74,0.5)]" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            <div class="mt-6 flex justify-between items-center flex-wrap gap-4">
                <button id="exportBtn" class="text-sm bg-bleach-accent hover:bg-blue-600 text-white px-4 py-2 rounded transition flex items-center gap-2 font-bold shadow-lg shadow-blue-950">
                    <i class="fa-solid fa-download"></i> Exporter mes épisodes vus (JSON)
                </button>
                <button id="resetBtn" class="text-sm text-gray-400 hover:text-red-500 transition flex items-center gap-2 font-medium">
                    <i class="fa-solid fa-trash-can"></i> Réinitialiser ma progression
                </button>
            </div>
        </section>

        <section class="mb-8 flex flex-wrap gap-3 justify-center md:justify-start" id="filters">
            <button data-filter="all" class="filter-btn active px-5 py-2 rounded-full bg-bleach-accent text-white font-bold transition hover:bg-blue-600 shadow-lg shadow-blue-950 text-sm">Tous</button>
            <button data-filter="canon" class="filter-btn px-5 py-2 rounded-full bg-bleach-gray text-gray-300 font-semibold transition hover:bg-gray-800 border border-gray-800 text-sm">Canon</button>
            <button data-filter="semifiller" class="filter-btn px-5 py-2 rounded-full bg-bleach-gray text-gray-300 font-semibold transition hover:bg-gray-800 border border-gray-800 text-sm">Semi-filler</button>
            <button data-filter="filler" class="filter-btn px-5 py-2 rounded-full bg-bleach-gray text-gray-300 font-semibold transition hover:bg-gray-800 border border-gray-800 text-sm">Hors-série</button>
        </section>

        <div id="episodesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <!-- MODALE SYNOPSIS TMDB -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity duration-200 opacity-0">
        <div id="modalContainer" class="bg-bleach-gray border border-gray-800 rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl transform scale-95 transition-transform duration-200">
            <div class="relative h-64 bg-black">
                <img id="modalImg" src="" alt="" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-[#161616] via-transparent to-black/60"></div>
                
                <button id="closeModalBtn" class="absolute top-4 right-4 text-white bg-black/50 hover:bg-black/80 rounded-full w-9 h-9 flex items-center justify-center border border-gray-700 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>

                <div class="absolute bottom-4 left-6 right-6">
                    <span id="modalBadge" class="text-[10px] px-2.5 py-1 rounded font-bold uppercase tracking-wider inline-block mb-2"></span>
                    <h2 id="modalTitle" class="text-2xl font-black text-white leading-tight"></h2>
                    <p id="modalSub" class="text-xs text-gray-400 font-medium mt-1"></p>
                </div>
            </div>

            <div class="p-6 space-y-4">
                <div class="flex items-center gap-6 text-sm text-gray-400 border-b border-gray-800/80 pb-3">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-star text-yellow-500"></i>
                        <span id="modalRating" class="font-bold text-white"></span> / 10
                    </div>
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-calendar text-bleach-accent"></i>
                        <span id="modalDate"></span>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs uppercase font-bold text-gray-500 mb-2 tracking-wider">Synopsis</h3>
                    <p id="modalOverview" class="text-gray-300 text-sm leading-relaxed max-h-48 overflow-y-auto pr-2"></p>
                </div>

                <div class="pt-2 flex gap-3">
                    <a id="modalBetaBtn" href="#" target="_blank" rel="noopener noreferrer" class="flex-1 text-center bg-bleach-accent hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-2 shadow-lg shadow-blue-950">
                        <i class="fa-solid fa-tv"></i> Voir sur BetaSeries
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-bleach-gray border-t border-gray-800 py-6 mt-12">
        <div class="container mx-auto px-4 text-center text-gray-500 text-sm">
            <p>Bleach Tracker &copy; 2026 - Données TMDB & BetaSeries.</p>
        </div>
    </footer>

    <script>
        const TMDB_API_KEY = "02a0fe7ad4f325897c61808483d554e0";
        const BLEACH_TMDB_ID = 30984;
        let isTmdbLoaded = false;

        function range(start, end) {
            return Array(end - start + 1).fill().map((_, idx) => start + idx);
        }

        const fillers = [33, 50, ...range(64, 108), ...range(128, 137), ...range(147, 149), ...range(168, 189), 204, 205, 213, 214, ...range(227, 265), 287, 298, 299, ...range(303, 305), ...range(311, 341), 355];
        const semiFillers = [8, 27, 32, 46, 109, 111, 116, 119, 141, 143, 146, 156, 160, 161, 190, 193, 206, 269, 342, 343];

        function getSeasonInfo(epNum) {
            if (epNum <= 20) return { s: 1, e: epNum };
            if (epNum <= 41) return { s: 2, e: epNum - 20 };
            if (epNum <= 63) return { s: 3, e: epNum - 41 };
            if (epNum <= 91) return { s: 4, e: epNum - 63 };
            if (epNum <= 109) return { s: 5, e: epNum - 91 };
            if (epNum <= 131) return { s: 6, e: epNum - 109 };
            if (epNum <= 151) return { s: 7, e: epNum - 131 };
            if (epNum <= 167) return { s: 8, e: epNum - 151 };
            if (epNum <= 190) return { s: 9, e: epNum - 167 };
            if (epNum <= 205) return { s: 10, e: epNum - 190 };
            if (epNum <= 212) return { s: 11, e: epNum - 205 };
            if (epNum <= 229) return { s: 12, e: epNum - 212 };
            if (epNum <= 265) return { s: 13, e: epNum - 229 };
            if (epNum <= 316) return { s: 14, e: epNum - 265 };
            if (epNum <= 342) return { s: 15, e: epNum - 316 };
            return { s: 16, e: epNum - 342 };
        }

        const episodes = [];
        const totalEpisodes = 366;
        let totalMainStream = 0;

        for (let i = 1; i <= totalEpisodes; i++) {
            let type = "Canon";
            let cat = "canon";
            if (fillers.includes(i)) { type = "Hors-série"; cat = "filler"; }
            else if (semiFillers.includes(i)) { type = "Semi-filler"; cat = "semifiller"; }
            
            if (cat === "canon" || cat === "semifiller") totalMainStream++;

            const si = getSeasonInfo(i);
            const sStr = String(si.s).padStart(2, '0');
            const eStr = String(si.e).padStart(2, '0');
            const betaUrl = `https://www.betaseries.com/episode/bleachjp/s${sStr}e${eStr}`;

            episodes.push({
                id: i,
                title: `Épisode ${i}`,
                type: type,
                category: cat,
                season: si.s,
                epInSeason: si.e,
                betaUrl: betaUrl,
                stillPath: null,
                overview: null,
                voteAverage: null,
                airDate: null
            });
        }

        let watched = JSON.parse(localStorage.getItem('bleachWatched')) || {};
        let currentFilter = 'all';
        let searchQuery = '';

        const grid = document.getElementById('episodesGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const resetBtn = document.getElementById('resetBtn');
        const exportBtn = document.getElementById('exportBtn');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalContainer = document.getElementById('modalContainer');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // Récupère l'intégralité de la Saison 1 (les 366 épisodes selon TMDB)
        async function fetchAllTMDB() {
            if (isTmdbLoaded) return;
            try {
                const response = await fetch(`https://api.themoviedb.org/3/tv/${BLEACH_TMDB_ID}/season/1?api_key=${TMDB_API_KEY}&language=fr-FR`);
                if (!response.ok) return;
                const data = await response.json();
                
                if (data.episodes) {
                    data.episodes.forEach(tmdbEp => {
                        const epNum = tmdbEp.episode_number;
                        const localEp = episodes.find(e => e.id === epNum);
                        if (localEp) {
                            localEp.title = tmdbEp.name || localEp.title;
                            localEp.stillPath = tmdbEp.still_path ? `https://image.tmdb.org/t/p/w780${tmdbEp.still_path}` : null;
                            localEp.overview = tmdbEp.overview || "Aucun résumé disponible en français.";
                            localEp.voteAverage = tmdbEp.vote_average ? tmdbEp.vote_average.toFixed(1) : "N/A";
                            localEp.airDate = tmdbEp.air_date ? new Date(tmdbEp.air_date).toLocaleDateString('fr-FR') : "Inconnue";
                        }
                    });
                    isTmdbLoaded = true;
                    renderEpisodes();
                }
            } catch (err) {
                console.error("Erreur TMDB:", err);
            }
        }

        function openEpisodeModal(epId) {
            const ep = episodes.find(e => e.id === epId);
            if (!ep) return;

            document.getElementById('modalImg').src = ep.stillPath || 'https://static.vecteezy.com/system/resources/previews/028/574/845/non_2x/bleach-anime-logo-free-vector.jpg';
            document.getElementById('modalTitle').textContent = ep.title;
            document.getElementById('modalSub').textContent = `Épisode ${ep.id} • Saison ${ep.season} Épisode ${ep.epInSeason}`;
            document.getElementById('modalOverview').textContent = ep.overview || "Chargement du résumé...";
            document.getElementById('modalRating').textContent = ep.voteAverage || "N/A";
            document.getElementById('modalDate').textContent = ep.airDate || "Non renseignée";
            document.getElementById('modalBetaBtn').href = ep.betaUrl;

            const modalBadge = document.getElementById('modalBadge');
            modalBadge.textContent = ep.type;
            if (ep.category === 'filler') {
                modalBadge.className = 'text-[10px] px-2.5 py-1 rounded font-bold uppercase tracking-wider inline-block mb-2 bg-red-600 text-white';
            } else if (ep.category === 'semifiller') {
                modalBadge.className = 'text-[10px] px-2.5 py-1 rounded font-bold uppercase tracking-wider inline-block mb-2 bg-yellow-500 text-slate-950';
            } else {
                modalBadge.className = 'text-[10px] px-2.5 py-1 rounded font-bold uppercase tracking-wider inline-block mb-2 bg-green-600 text-white';
            }

            modalOverlay.classList.remove('hidden');
            setTimeout(() => {
                modalOverlay.classList.remove('opacity-0');
                modalContainer.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            modalOverlay.classList.add('opacity-0');
            modalContainer.classList.add('scale-95');
            setTimeout(() => {
                modalOverlay.classList.add('hidden');
            }, 200);
        }

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        function saveState() {
            localStorage.setItem('bleachWatched', JSON.stringify(watched));
            updateProgress();
        }

        function toggleWatched(id, isChecked) {
            if (isChecked) watched[id] = true;
            else delete watched[id];
            saveState();
            
            const card = document.getElementById(`card-${id}`);
            if (card) {
                if (isChecked) {
                    card.classList.add('opacity-50', 'grayscale');
                    card.classList.remove('border-gray-800');
                    card.classList.add('border-bleach-accent/50');
                } else {
                    card.classList.remove('opacity-50', 'grayscale', 'border-bleach-accent/50');
                    card.classList.add('border-gray-800');
                }
            }
        }

        function updateProgress() {
            const watchedIds = Object.keys(watched).map(Number);
            const watchedTotal = watchedIds.length;
            const watchedMain = watchedIds.filter(id => {
                const ep = episodes.find(e => e.id === id);
                return ep && (ep.category === 'canon' || ep.category === 'semifiller');
            }).length;

            const globalPct = Math.round((watchedTotal / totalEpisodes) * 100) || 0;
            const mainPct = Math.round((watchedMain / totalMainStream) * 100) || 0;

            document.getElementById('globalProgressText').textContent = `${globalPct}% (${watchedTotal}/${totalEpisodes})`;
            document.getElementById('globalProgressBar').style.width = `${globalPct}%`;

            document.getElementById('canonProgressText').textContent = `${mainPct}% (${watchedMain}/${totalMainStream})`;
            document.getElementById('canonProgressBar').style.width = `${mainPct}%`;
        }

        function renderEpisodes() {
            const filtered = episodes.filter(ep => {
                const matchFilter = currentFilter === 'all' || ep.category === currentFilter;
                const matchSearch = ep.id.toString().includes(searchQuery) || 
                                    ep.type.toLowerCase().includes(searchQuery) ||
                                    ep.title.toLowerCase().includes(searchQuery);
                return matchFilter && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 text-lg">Aucun épisode trouvé.</div>`;
                return;
            }

            const html = filtered.map(ep => {
                const isWatched = !!watched[ep.id];
                
                let badgeColor = 'bg-green-600 text-white';
                if (ep.category === 'filler') {
                    badgeColor = 'bg-red-600 text-white';
                } else if (ep.category === 'semifiller') {
                    badgeColor = 'bg-yellow-500 text-slate-950 font-bold';
                }

                const opacityClass = isWatched ? 'opacity-50 grayscale border-bleach-accent/50' : 'border-gray-800';
                
                const imageSrc = ep.stillPath || 'https://static.vecteezy.com/system/resources/previews/028/574/845/non_2x/bleach-anime-logo-free-vector.jpg';
                const imageStyle = ep.stillPath ? 'object-cover opacity-60' : 'object-contain p-4 opacity-25 filter drop-shadow';

                return `
                    <div id="card-${ep.id}" onclick="openEpisodeModal(${ep.id})" class="episode-card bg-[#161616] rounded-xl overflow-hidden border ${opacityClass} flex flex-col relative shadow-md">
                        <div class="relative bg-gradient-to-tr from-black via-neutral-900 to-black h-36 flex items-center justify-center border-b border-gray-800/80 overflow-hidden">
                            <img src="${imageSrc}" alt="Épisode ${ep.id}" class="absolute inset-0 w-full h-full ${imageStyle}">
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                            <div class="text-center z-10 px-2 mt-auto mb-2">
                                <span class="text-white font-black text-2xl tracking-widest drop-shadow-[0_2px_8px_rgba(0,0,0,0.9)]">#${ep.id}</span>
                                <p class="text-[11px] text-gray-300 uppercase tracking-wider font-semibold">Saison ${ep.season} • Ép. ${ep.epInSeason}</p>
                            </div>
                            <span class="absolute top-2 right-2 ${badgeColor} text-[10px] px-2 py-0.5 rounded shadow uppercase tracking-wider z-10">${ep.type}</span>
                        </div>
                        <div class="p-4 flex-grow flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-2 gap-2">
                                    <h3 class="text-sm font-bold text-white tracking-wide line-clamp-2" title="${ep.title}">${ep.title}</h3>
                                    <input type="checkbox" id="chk-${ep.id}" class="checkbox-custom flex-shrink-0 mt-0.5" ${isWatched ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleWatched(${ep.id}, this.checked)">
                                </div>
                            </div>
                            <div class="mt-3 text-xs text-bleach-accent flex items-center justify-between font-semibold pt-2 border-t border-gray-800/60">
                                <span><i class="fa-solid fa-circle-info mr-1"></i> Voir le détail</span>
                                <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            grid.innerHTML = html;
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderEpisodes();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-bleach-accent', 'text-white', 'shadow-lg', 'shadow-blue-950');
                    b.classList.add('bg-bleach-gray', 'text-gray-300', 'border', 'border-gray-800');
                });
                btn.classList.remove('bg-bleach-gray', 'text-gray-300', 'border', 'border-gray-800');
                btn.classList.add('bg-bleach-accent', 'text-white', 'shadow-lg', 'shadow-blue-950');
                
                currentFilter = btn.dataset.filter;
                renderEpisodes();
            });
        });

        exportBtn.addEventListener('click', () => {
            const watchedIds = Object.keys(watched).map(Number);
            if (watchedIds.length === 0) {
                alert("Aucun épisode n'a été marqué comme vu pour l'instant !");
                return;
            }
            const watchedData = watchedIds.map(id => episodes.find(e => e.id === id)).filter(Boolean);
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(watchedData, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "bleach_episodes_vus.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        });

        resetBtn.addEventListener('click', () => {
            if (confirm("Êtes-vous sûr de vouloir réinitialiser toute votre progression ? Cette action est irréversible.")) {
                watched = {};
                saveState();
                renderEpisodes();
            }
        });

        updateProgress();
        renderEpisodes();
        fetchAllTMDB();
    </script>
</body>
</html>
